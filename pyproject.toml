[project]
name = "agentao"
dynamic = ["version"]
description = "A governed agent runtime for local-first, private-first, embeddable AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bo Jin"}]
keywords = ["agent", "cli", "llm", "openai", "mcp", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Core: minimum needed to construct Agentao() and call chat() against
    # an OpenAI-compatible endpoint. CLI / web-fetch / Chinese tokenization
    # are opt-in extras.
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    # Both SDK majors are supported — see agentao/mcp/_compat.py. The upper
    # bound is deliberate: mcp 2.0 was a breaking release (snake_case wire
    # fields, httpx→httpx2, float timeouts, 2-tuple transports) and a bare
    # ">=1.26.0" let a fresh install silently resolve to it. Upstream still
    # ships v1 (1.29.0 landed the same day as 2.0.0), so agentao tracks both
    # rather than forcing hosts off 1.x. Raise the floor only when agentao
    # actually needs a 2.x-only capability, and do it on a major boundary.
    "mcp>=1.26.0,<3",
    "python-dotenv>=1.0.0",
    # Required at runtime by agentao/skills/registry.py for cross-process
    # locking. Lazy-imported, but kept in core because any host that
    # activates skills will trip ImportError otherwise.
    "filelock>=1.4.0",
    # ``agentao run`` spec templating — render_spec uses Jinja2 with
    # StrictUndefined for ``prompt`` / ``instructions`` substitution.
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
# CLI surface — `agentao` console script + interactive UI
cli       = ["rich>=13.0.0", "prompt-toolkit>=3.0.52", "readchar>=4.2.1", "pygments>=2.16.0"]
# Web fetch tool — HTML parsing
web       = ["beautifulsoup4>=4.12.0"]
# Chinese-text tokenization for memory keyword retrieval
i18n      = ["jieba>=0.42.1"]
# Local headless-browser fallback for `web_fetch` (JS-rendered pages).
# Playwright directly, not crawl4ai: agentao only ever used ~9 lines of it as
# a "render page → markdown" wrapper, and it dragged in 51 transitive packages
# (two browser stacks, a geometry stack, an LLM client) for that. Needs
# `playwright install chromium` on top of the pip install. Pulls [web] because
# the fallback reuses the same BeautifulSoup extraction as the primary path.
# Floor is 1.48, not the older 1.40: `BrowserContext.route_web_socket`
# landed there, and without it a rendered page's WebSocket connections
# bypass the outbound-URL guard entirely (`context.route` does not cover
# them). The extra is new in 0.4.18, so nothing is stranded by the floor.
playwright = ["agentao[web]", "playwright>=1.48.0"]
tokenizer = ["tiktoken>=0.7.0"]
full      = ["agentao[cli,web,i18n,playwright,tokenizer]"]

[project.urls]
Homepage = "https://github.com/jin-bo/agentao"
Repository = "https://github.com/jin-bo/agentao"
"Bug Tracker" = "https://github.com/jin-bo/agentao/issues"

[project.scripts]
agentao = "agentao.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "agentao/__init__.py"

[tool.hatch.build.targets.wheel]
exclude = [
    "workspace", "docs", "developer-guide", "examples", "agentao.log", "main.py", "run.sh", "AGENTAO.md", ".agentao",
]
force-include = {"skills/skill-creator" = "skills/skill-creator", "agentao/py.typed" = "agentao/py.typed"}

[tool.hatch.build.targets.sdist]
exclude = [
    ".agentao",
    ".claude",
    ".github",
    ".pytest_cache",
    ".venv",
    "agentao.log",
    "developer-guide",
    "dist",
    "docs",
    "examples",
    "main.py",
    "run.sh",
    "tests",
    "workspace",
    "AGENTAO.md",
    "CLAUDE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -m 'not slow'"
markers = [
    "slow: tests that build / install / boot subprocess venvs (P0.7 clean-install smoke)",
]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=9.0.2",
    "twine>=6.1.0",
    "mypy>=1.13.0",
    "packaging>=25.0",
    "ruff>=0.14.0",
]

[tool.ruff]
# Lint gate — deliberately narrow. See docs/design/lint-gate.md for the
# measurement behind the selection.
target-version = "py310"

[tool.ruff.lint]
# Only rules that flag a genuine defect, never style. Measured against the
# tree at 7eb762e: the opinionated sets would have fired 2743 times (UP) and
# 253 times (F401) without identifying a single live bug, so they are out.
#
#   E9   syntax / IO errors — code that cannot run
#   F402 import shadowed by a loop variable — latent UnboundLocalError
#   F811 redefinition of an unused name — one of the two is dead
#   F821 undefined name — guaranteed NameError at runtime
#   F405 undefined name *in a module with a star import* — see below
#
# F821 is the reason this gate exists: it was 0 when the gate landed, but
# PR #141 had to fix one, so the class is reachable here.
#
# F405 is not a separate ambition — it is what makes F821 actually hold.
# pyflakes downgrades every undefined name to F405 in any module containing
# `from x import *`, so with F821 alone the rule is silently inert in
# exactly the 8 star-import shims: `agentao/harness/*` (the deprecated
# public alias, which carries real post-import logic) and
# `agentao/tool_runner.py`. Verified by probe: an undefined name in a
# star-import module reports `All checks passed` under F821 and `F405`
# under F405. It measures 0 across the repo, so it costs nothing today and
# closes the hole before the 0.5.0 alias removal edits those files.
#
# `select` replaces ruff's default `E4,E7,E9,F` rather than extending it.
# That is deliberate but worth stating: it also drops F841 (unused
# variable, 25 hits) and the E4/E7 groups. F841 was measured, not
# overlooked — see docs/design/lint-gate.md.
#
# F401 (unused-import) is enforced everywhere except `agentao/` — see
# the per-file-ignores below for why.
select = ["E9", "F401", "F402", "F405", "F811", "F821"]

[tool.ruff.lint.per-file-ignores]
# `agentao/` is a published library, so F401 is not decidable there: a name
# re-exported for downstream embedders is imported by nobody in this repo,
# which is exactly what a public API looks like to a single-file linter.
# Deleting one is a silent breaking change for embedders, and this package
# maintains an explicit stability boundary (`agentao.host`, schema-drift CI).
#
# This is not a guess. Three independent checks disagreed with each other:
#
#   1. `ruff check --select F401 --fix` over the tree applied 212 fixes and
#      broke 9 test modules at collection, deleting the public surface of
#      `llm/client.py`, `acp_client/client.py` and `cli/__init__.py`.
#   2. A static "is this name imported from this module anywhere else"
#      classifier called `AcpInteractionRequiredError` and `_parse_retry_after`
#      dead — the two names check 1 proved were load-bearing.
#   3. The same classifier called `HostEvent` dead. It is in
#      `agentao.host.__all__`, i.e. the documented public surface.
#
# Since no available signal separates re-export from dead here, the rule is
# off for the whole package rather than per-module. Revisit only with an
# explicit `__all__` on every re-export hub, which would make it decidable.
#
# Known to be wider than the evidence: of the 68 hits, 25 are in __init__.py
# and 42 are in 22 leaf modules, of which check 1 proved exactly 2 load-bearing
# — and at least one silenced hit (sandbox/policy.py:32, `import platform`) is
# genuinely dead. Narrowing to __init__.py + the two named hubs was considered
# and declined: those two were found by breaking the build, not by a method
# that generalises, so the enumeration is not known to be complete.
"agentao/**" = ["F401"]

[tool.mypy]
# P0.4 typing gate — strict only on the public host boundary; the rest of
# the codebase is untouched until separate items raise its bar.
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["agentao.host.*"]
strict = true
warn_unused_ignores = true
disallow_any_explicit = false

