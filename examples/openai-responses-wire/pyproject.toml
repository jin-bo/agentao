[project]
name = "agentao-example-openai-responses-wire"
version = "0.1.0"
description = "Embed Agentao over OpenAI's Responses API (api_format=\"openai-responses\")."
requires-python = ">=3.10"
dependencies = [
    "agentao",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
agentao = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
