[project]
name = "agentao-example-anthropic-wire"
version = "0.1.0"
description = "Embed Agentao over Anthropic's native Messages API (api_format=\"anthropic-messages\")."
requires-python = ">=3.10"
dependencies = [
    "agentao",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
agentao = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
